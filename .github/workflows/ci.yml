name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Pasang dependensi
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Simpan vendor
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Ambil vendor
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Siapkan aplikasi
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Jalankan pengujian
        run: php artisan test

      - name: Periksa style
        run: ./vendor/bin/pint --test

  staging:
    name: Staging
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke staging
        run: echo "Deploy ke staging selesai."

  production:
    name: Production
    needs: staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy ke produksi
        run: |
          echo "1. php artisan down --retry=60"
          echo "2. git pull origin main"
          echo "3. composer install --no-dev --optimize-autoloader"
          echo "4. php artisan migrate --force"
          echo "5. php artisan config:cache && php artisan route:cache && php artisan view:cache"
          echo "6. php artisan queue:restart"
          echo "7. php artisan up"
